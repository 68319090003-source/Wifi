<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Farm Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>

<body class="bg-gray-100 font-sans min-h-screen">
<div class="container mx-auto px-4 py-10">

<h1 class="text-3xl font-bold text-center text-green-700 mb-10">
🌿 Smart Monitor Dashboard
</h1>

<div id="sensor-panel" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">

<!-- TEMP -->
<div class="bg-white rounded-xl shadow-lg p-6 text-center border-t-4 border-orange-500">
<p class="uppercase text-gray-500 font-semibold">อุณหภูมิ</p>
<div class="text-5xl font-bold text-orange-600 my-2">
<span id="temp-val">--</span> °C
</div>
<p id="temp-status" class="text-sm font-semibold"></p>
</div>

<!-- SOIL -->
<div class="bg-white rounded-xl shadow-lg p-6 text-center border-t-4 border-blue-500">
<p class="uppercase text-gray-500 font-semibold">ความชื้นดิน</p>
<div class="text-5xl font-bold text-blue-600 my-2">
<span id="soil-val">--</span>
</div>
<p id="soil-status" class="text-sm font-semibold"></p>
</div>

<!-- LDR -->
<div class="bg-white rounded-xl shadow-lg p-6 text-center border-t-4 border-yellow-500">
<p class="uppercase text-gray-500 font-semibold">แสง (LDR)</p>
<div class="text-4xl font-bold my-2" id="ldr-val">--</div>
<p id="ldr-status" class="text-sm font-semibold"></p>
</div>

</div>

<!-- CONTROL -->
<div class="bg-white rounded-xl shadow-lg p-8 max-w-md mx-auto border-t-4 border-green-500">
<h2 class="text-xl font-bold text-center mb-6">Device Control</h2>

<div class="flex flex-col space-y-4">
<button onclick="sendCommand('on')"
class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg">
เปิดระบบ (ON)
</button>

<button onclick="sendCommand('off')"
class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-lg">
ปิดระบบ (OFF)
</button>
</div>

<div class="mt-4 text-center text-sm">
คำสั่งล่าสุด: <span id="last-cmd" class="font-bold">--</span>
</div>
</div>

</div>

<script>

/* ✅ FIREBASE CONFIG ตัวจริง */
firebase.initializeApp({
  apiKey: "AIzaSyCaIHZeMx6Pa97VAHH9d_XYhPwK3gsFFg0",
  authDomain: "wifi-73e6a.firebaseapp.com",
  databaseURL: "https://wifi-73e6a-default-rtdb.firebaseio.com",
  projectId: "wifi-73e6a",
  storageBucket: "wifi-73e6a.firebasestorage.app",
  messagingSenderId: "985107943146",
  appId: "1:985107943146:web:4d87a38114a29507745193"
});

const db = firebase.database();

let systemEnabled = true;

/* CLEAR DISPLAY */
function clearSensorDisplay(){
  tempVal("--","ระบบปิด");
  soilVal("--","ระบบปิด");
  ldrVal("--","ระบบปิด");
  document.getElementById("sensor-panel").classList.add("opacity-40");
}

/* ENABLE DISPLAY */
function enableSensorDisplay(){
  document.getElementById("sensor-panel").classList.remove("opacity-40");
}

/* UI HELPERS */
function tempVal(v,status){
  document.getElementById("temp-val").innerText=v;
  document.getElementById("temp-status").innerText=status;
}

function soilVal(v,status){
  document.getElementById("soil-val").innerText=v;
  document.getElementById("soil-status").innerText=status;
}

function ldrVal(v,status){
  document.getElementById("ldr-val").innerText=v;
  document.getElementById("ldr-status").innerText=status;
}

/* โหลดค่าเซ็นเซอร์ทันที */
function reloadSensorData(){
  db.ref("sensor").once("value").then(snap=>{
    const d = snap.val();
    if(!d) return;

    if(d.temp!=null)
      tempVal(d.temp.toFixed(1),"ปกติ");

    if(d.soil_percent!=null)
      soilVal(d.soil_percent+" %","");

    if(d.light!=null)
      ldrVal(d.light==1?"🌞 สว่าง":"🌙 มืด","");
  });
}

/* REALTIME SENSOR */
db.ref("sensor").on("value", snap=>{

  if(!systemEnabled) return;

  const d = snap.val();
  if(!d) return;

  if(d.temp!=null)
    tempVal(d.temp.toFixed(1),"ปกติ");

  if(d.soil_percent!=null){

    let status="ปกติ";
    if(d.soil_percent<=30) status="🚨 ดินแห้ง";
    else if(d.soil_percent<=60) status="🌱 กำลังดี";
    else status="💧 ชื้นมาก";

    soilVal(d.soil_percent+" %",status);
  }

  if(d.light!=null)
    ldrVal(d.light==1?"🌞 สว่าง":"🌙 มืด","สถานะปัจจุบัน");

});

/* CONTROL */
function sendCommand(cmd){
  db.ref("control").update({last_command:cmd});
}

db.ref("control/last_command").on("value", snap=>{

  const cmd=snap.val() || "--";
  document.getElementById("last-cmd").innerText=cmd;

  if(cmd==="off"){
    systemEnabled=false;
    clearSensorDisplay();
  }else{
    systemEnabled=true;
    enableSensorDisplay();
    reloadSensorData();
  }

});

</script>

</body>
</html>
