<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Farm Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

</head>

<body class="bg-gray-100 min-h-screen font-sans">

<div class="container mx-auto px-4 py-10">

<h1 class="text-3xl font-bold text-center text-green-700 mb-8">
🌿 Smart Farm Dashboard
</h1>

<!-- SENSOR -->
<div class="grid md:grid-cols-3 gap-6 mb-10">

<div class="bg-white p-6 rounded-xl shadow text-center">
<p>อุณหภูมิ</p>
<div class="text-4xl font-bold text-orange-600">
<span id="temp">--</span> °C
</div>
<p id="tempStatus"></p>
</div>

<div class="bg-white p-6 rounded-xl shadow text-center">
<p>ความชื้นดิน</p>
<div class="text-4xl font-bold text-blue-600">
<span id="soil">--</span>
</div>
<p id="soilStatus"></p>
</div>

<div class="bg-white p-6 rounded-xl shadow text-center">
<p>แสง</p>
<div id="light" class="text-3xl font-bold">--</div>
</div>

</div>

<!-- LIMIT -->
<div class="bg-white p-6 rounded-xl shadow max-w-md mx-auto mb-8">

<h2 class="text-xl font-bold text-center mb-4">ตั้งค่าแจ้งเตือน</h2>

<input id="limitTemp" class="border p-2 w-full mb-2" type="number" placeholder="Temp Limit">
<input id="limitSoil" class="border p-2 w-full mb-4" type="number" placeholder="Soil Limit">

<button onclick="saveLimit()" class="bg-red-500 text-white w-full p-3 rounded">
บันทึก
</button>

</div>

<!-- CONTROL -->
<div class="bg-white p-6 rounded-xl shadow max-w-md mx-auto">
<h2 class="text-xl font-bold text-center mb-4">Control LED</h2>

<button onclick="setLED(1)" class="bg-green-500 text-white w-full p-3 mb-2 rounded">
เปิด
</button>

<button onclick="setLED(0)" class="bg-red-500 text-white w-full p-3 rounded">
ปิด
</button>
</div>

</div>

<script>

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "wifi-73e6a.firebaseapp.com",
  databaseURL: "https://wifi-73e6a-default-rtdb.firebaseio.com/",
  projectId: "wifi-73e6a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let tempLimit = 35;
let soilLimit = 400;

/* SENSOR */
db.ref("sensor").on("value", snap => {

  const d = snap.val();
  if(!d) return;

  temp.innerText = d.temp.toFixed(1);
  soil.innerText = d.soil;
  light.innerText = d.light ? "🌞 สว่าง" : "🌙 มืด";

  tempStatus.innerText =
    d.temp >= tempLimit ? "🚨 ร้อนเกิน" : "ปกติ";

  soilStatus.innerText =
    d.soil > soilLimit ? "🚨 ดินแห้ง" : "ปกติ";

});

/* LIMIT */
db.ref("limit").on("value", snap=>{
  const d=snap.val();
  if(!d) return;

  tempLimit=d.temp;
  soilLimit=d.soil;

  limitTemp.value=tempLimit;
  limitSoil.value=soilLimit;
});

function saveLimit(){
  db.ref("limit").set({
    temp:Number(limitTemp.value),
    soil:Number(limitSoil.value)
  });
}

/* CONTROL */
function setLED(v){
  db.ref("control").set({led:v});
}

</script>
</body>
</html>
