<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Farm Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>

<body class="bg-gray-100 font-sans min-h-screen">
<div class="container mx-auto px-4 py-10">

<h1 class="text-3xl font-bold text-center text-green-700 mb-10">
🌿 Smart Monitor Dashboard
</h1>

<!-- SENSOR DISPLAY -->
<div id="sensor-panel" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">

<div class="bg-white rounded-xl shadow-lg p-6 text-center border-t-4 border-orange-500">
<p class="uppercase text-gray-500 font-semibold">อุณหภูมิ</p>
<div class="text-5xl font-bold text-orange-600 my-2">
<span id="temp-val">--</span> °C
</div>
<p id="temp-status" class="text-sm font-semibold"></p>
</div>

<div class="bg-white rounded-xl shadow-lg p-6 text-center border-t-4 border-blue-500">
<p class="uppercase text-gray-500 font-semibold">ความชื้นดิน</p>
<div class="text-5xl font-bold text-blue-600 my-2">
<span id="soil-val">--</span>
</div>
<p id="soil-status" class="text-sm font-semibold"></p>
</div>

<div class="bg-white rounded-xl shadow-lg p-6 text-center border-t-4 border-yellow-500">
<p class="uppercase text-gray-500 font-semibold">แสง (LDR)</p>
<div class="text-4xl font-bold my-2" id="ldr-val">--</div>
<p id="ldr-status" class="text-sm font-semibold"></p>
</div>

</div>

<!-- LIMIT -->
<div class="bg-white rounded-xl shadow-lg p-8 max-w-xl mx-auto mb-10 border-t-4 border-red-500">
<h2 class="text-xl font-bold text-center mb-6">⚙️ ตั้งค่าแจ้งเตือน</h2>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4">

<div>
<label class="text-sm text-gray-600">อุณหภูมิเตือน (°C)</label>
<input id="limit-temp" type="number" class="w-full mt-1 p-2 border rounded">
</div>

<div>
<label class="text-sm text-gray-600">ความชื้นเตือน (%)</label>
<input id="limit-soil" type="number" class="w-full mt-1 p-2 border rounded">
</div>

</div>

<button onclick="saveLimit()"
class="mt-6 w-full bg-red-500 hover:bg-red-600 text-white py-3 rounded-lg font-bold">
บันทึกค่า Limit
</button>
</div>

<!-- CONTROL -->
<div class="bg-white rounded-xl shadow-lg p-8 max-w-md mx-auto border-t-4 border-green-500">
<h2 class="text-xl font-bold text-center mb-6">Device Control</h2>

<div class="flex flex-col space-y-4">
<button onclick="sendCommand('on')"
class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg">
เปิดระบบ (ON)
</button>

<button onclick="sendCommand('off')"
class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-lg">
ปิดระบบ (OFF)
</button>
</div>

<div class="mt-4 text-center text-sm">
คำสั่งล่าสุด: <span id="last-cmd" class="font-bold">--</span>
</div>
</div>

</div>

<script>

/* FIREBASE */
firebase.initializeApp({
apiKey: "AIzaSy...",
databaseURL: "https://wifi-73e6a-default-rtdb.firebaseio.com/",
projectId: "wifi-73e6a"
});

const db = firebase.database();

/* STATE */
let systemEnabled = true;
let tempLimit = 30;
let soilLimit = 50;

/* CLEAR DISPLAY */
function clearSensorDisplay(){

document.getElementById("temp-val").innerText="--";
document.getElementById("temp-status").innerText="ระบบปิด";

document.getElementById("soil-val").innerText="--";
document.getElementById("soil-status").innerText="ระบบปิด";

document.getElementById("ldr-val").innerText="--";
document.getElementById("ldr-status").innerText="ระบบปิด";

document.getElementById("sensor-panel").classList.add("opacity-40");
}

/* ENABLE DISPLAY */
function enableSensorDisplay(){
document.getElementById("sensor-panel").classList.remove("opacity-40");
}

/* ⭐ RELOAD SENSOR (แก้บัคหลัก) */
function reloadSensorData(){

db.ref("sensor/temp").once("value").then(snap=>{
const v=snap.val();
if(v!=null){
document.getElementById("temp-val").innerText=v.toFixed(1);
document.getElementById("temp-status").innerText=
v>=tempLimit ? "🚨 เกินค่าที่ตั้งไว้":"ปกติ";
}
});

db.ref("sensor/soil_percent").once("value").then(snap=>{
const v=snap.val();
if(v!=null){
document.getElementById("soil-val").innerText=v+" %";
}
});

db.ref("sensor/light").once("value").then(snap=>{
const v=snap.val();
if(v!=null){
document.getElementById("ldr-val").innerText=
v==1 ? "🌞 สว่าง":"🌙 มืด";
}
});

}

/* SENSOR REALTIME */

// TEMP
db.ref("sensor/temp").on("value", snap=>{
if(!systemEnabled) return;

const v=snap.val();
if(v!=null){
document.getElementById("temp-val").innerText=v.toFixed(1);
document.getElementById("temp-status").innerText=
v>=tempLimit ? "🚨 เกินค่าที่ตั้งไว้":"ปกติ";
}
});

// SOIL
db.ref("sensor/soil_percent").on("value", snap=>{
if(!systemEnabled) return;

const v=snap.val();
if(v!=null){

document.getElementById("soil-val").innerText=v+" %";

let status="ปกติ";
if(v<=30) status="🚨 ดินแห้ง";
else if(v<=60) status="🌱 กำลังดี";
else status="💧 ชื้นมาก";

document.getElementById("soil-status").innerText=status;
}
});

// LDR
db.ref("sensor/light").on("value", snap=>{
if(!systemEnabled) return;

const v=snap.val();
if(v!=null){
document.getElementById("ldr-val").innerText=
v==1 ? "🌞 สว่าง":"🌙 มืด";
document.getElementById("ldr-status").innerText="สถานะปัจจุบัน";
}
});

/* LIMIT */
db.ref("limit").on("value", snap=>{
const data=snap.val();
if(!data) return;

tempLimit=data.temp;
soilLimit=data.soil;

document.getElementById("limit-temp").value=tempLimit;
document.getElementById("limit-soil").value=soilLimit;
});

function saveLimit(){
db.ref("limit").set({
temp:Number(document.getElementById("limit-temp").value),
soil:Number(document.getElementById("limit-soil").value)
});
alert("บันทึกค่าเรียบร้อย");
}

/* CONTROL */
function sendCommand(cmd){
db.ref("control").update({last_command:cmd});
}

db.ref("control/last_command").on("value", snap=>{

const cmd=snap.val() || "--";
document.getElementById("last-cmd").innerText=cmd;

if(cmd==="off"){

systemEnabled=false;
clearSensorDisplay();

}else{

systemEnabled=true;
enableSensorDisplay();
reloadSensorData(); // ⭐ โหลดค่าทันทีตอน ON

}

});

</script>

</body>
</html>
